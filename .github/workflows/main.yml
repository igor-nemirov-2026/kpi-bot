yaml
name: KPI в Telegram

on:
  workflow_dispatch:
  push:
    paths: ["data/**"]
  schedule:
    - cron: "0 8,13 * * 1-5"

jobs:
  kpi:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Kyiv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Расчёт KPI и публикация в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py
      - name: Сохранить дашборд в истории запуска
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpi-dashboard
          path: out/
          retention-days: 30
